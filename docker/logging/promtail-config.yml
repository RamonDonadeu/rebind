server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from Docker containers that have logging.enabled=true
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers explicitly opted in
      - source_labels: ["__meta_docker_container_label_logging_enabled"]
        regex: "true"
        action: keep
      - source_labels: ["__meta_docker_container_label_logging_app"]
        target_label: app
      - source_labels: ["__meta_docker_container_label_logging_env"]
        target_label: environment
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # ReBind API emits structured JSON (Pino) to stdout
      - json:
          expressions:
            level: level
            service: service
            msg: msg
            event: event
            requestId: requestId
      - labels:
          level:
          service:
          event:
